[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads"
version = "0.1.0"
description = "Manage Meta (Facebook/Instagram) ads from Claude Code via the Marketing API, with human-approval gates."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
meta-ads = "meta_ads.cli:run"

[tool.setuptools.packages.find]
include = ["meta_ads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
