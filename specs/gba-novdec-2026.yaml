    ads:
      - name: GBA | Warm | It's back
        primary_text: |
          GET BETTER Academy is back for Nov–Dec.

          Same format that has sold out four years in a row: skill work, then 3-on-3 where the coaches actually teach. K–8th, boys and girls.

          New this year: two 4-week blocks instead of one long session, so it's easier to fit around the season. [PRICE] per block. Starts the week of Nov 2. Grab your player's grade block before it fills.
        headline: "GET BETTER Academy Is Back | Nov-Dec"
        description: "Two 4-week blocks | K-8th"
        link: https://breakawaybasketball.sprocketsports.com/club/get-better-academy?utm_source=meta&utm_medium=paid&utm_campaign=gba-novdec-2026&utm_content=warm-back
        cta: SIGN_UP
        image_hash: 3bad5fce43ceeb7b1baa0df8a280601a   # PLACEHOLDER

      - name: GBA | Warm | In-season reminder
        primary_text: |
          Your player's season is starting. This is the part of the year where most kids stop improving.

          GET BETTER Academy keeps them working: skill development plus 3-on-3 that teaches how to play. The kids who come out of the season better are the ones who kept training through it.

          Week of Nov 2. [LOCATIONS]. Tap to register.
        headline: "Keep Getting Better In Season"
        description: "K-8th | Starts Nov 2"
        link: https://breakawaybasketball.sprocketsports.com/club/get-better-academy?utm_source=meta&utm_medium=paid&utm_campaign=gba-novdec-2026&utm_content=warm-inseason
        cta: SIGN_UP
        image_hash: 3bad5fce43ceeb7b1baa0df8a280601a   # PLACEHOLDER

